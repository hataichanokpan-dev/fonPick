<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 400" fill="none">
  <defs>
    <linearGradient id="bn-grad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#22c55e"/>
      <stop offset="50%" style="stop-color:#3b82f6"/>
      <stop offset="100%" style="stop-color:#6366f1"/>
    </linearGradient>
    <linearGradient id="bn-glow" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#22c55e;stop-opacity:0.15"/>
      <stop offset="100%" style="stop-color:#6366f1;stop-opacity:0"/>
    </linearGradient>
    <linearGradient id="bn-fade-r" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#0a0e17;stop-opacity:0"/>
      <stop offset="100%" style="stop-color:#0a0e17;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="bn-fade-l" x1="100%" y1="0%" x2="0%" y2="0%">
      <stop offset="0%" style="stop-color:#0a0e17;stop-opacity:0"/>
      <stop offset="100%" style="stop-color:#0a0e17;stop-opacity:1"/>
    </linearGradient>
    <filter id="bn-shadow">
      <feDropShadow dx="0" dy="2" stdDeviation="8" flood-color="#22c55e" flood-opacity="0.25"/>
    </filter>
    <filter id="bn-glow-f">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="bn-clip">
      <rect width="1280" height="400" rx="16"/>
    </clipPath>
  </defs>

  <g clip-path="url(#bn-clip)">
    <!-- Background -->
    <rect width="1280" height="400" fill="#0a0e17"/>

    <!-- Grid pattern -->
    <g opacity="0.03" stroke="#94a3b8" stroke-width="0.5">
      <line x1="0" y1="80" x2="1280" y2="80"/>
      <line x1="0" y1="160" x2="1280" y2="160"/>
      <line x1="0" y1="240" x2="1280" y2="240"/>
      <line x1="0" y1="320" x2="1280" y2="320"/>
      <line x1="160" y1="0" x2="160" y2="400"/>
      <line x1="320" y1="0" x2="320" y2="400"/>
      <line x1="480" y1="0" x2="480" y2="400"/>
      <line x1="640" y1="0" x2="640" y2="400"/>
      <line x1="800" y1="0" x2="800" y2="400"/>
      <line x1="960" y1="0" x2="960" y2="400"/>
      <line x1="1120" y1="0" x2="1120" y2="400"/>
    </g>

    <!-- Background decorative chart waves -->
    <g opacity="0.06">
      <path d="M 0 300 Q 160 260 320 280 T 640 230 T 960 260 T 1280 200" stroke="#3b82f6" stroke-width="1" fill="none"/>
      <path d="M 0 320 Q 160 300 320 310 T 640 270 T 960 290 T 1280 240" stroke="#22c55e" stroke-width="1" fill="none"/>
    </g>

    <!-- Rising chart area -->
    <path d="M 660 380 L 720 340 L 800 310 L 870 320 L 940 260 L 1010 210 L 1080 160 L 1160 120 L 1160 400 L 660 400 Z" fill="url(#bn-glow)"/>

    <!-- Main chart line -->
    <path d="M 660 380 L 720 340 L 800 310 L 870 320 L 940 260 L 1010 210 L 1080 160 L 1160 120" stroke="url(#bn-grad)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none" filter="url(#bn-glow-f)"/>

    <!-- Stylized candlesticks in background -->
    <g opacity="0.08">
      <rect x="710" y="310" width="4" height="50" rx="1" fill="#22c55e"/>
      <rect x="790" y="280" width="4" height="45" rx="1" fill="#22c55e"/>
      <rect x="860" y="295" width="4" height="40" rx="1" fill="#ef4444"/>
      <rect x="930" y="240" width="4" height="35" rx="1" fill="#22c55e"/>
      <rect x="1000" y="190" width="4" height="30" rx="1" fill="#22c55e"/>
      <rect x="1070" y="140" width="4" height="30" rx="1" fill="#22c55e"/>
    </g>

    <!-- Pick target at peak -->
    <g transform="translate(1160,120)">
      <circle r="16" fill="none" stroke="#22c55e" stroke-width="1.5" opacity="0.3"/>
      <circle r="10" fill="none" stroke="#22c55e" stroke-width="1.5" opacity="0.5"/>
      <circle r="5" fill="#22c55e" opacity="0.9"/>
      <circle r="2" fill="#ffffff"/>
      <line x1="-20" y1="0" x2="-12" y2="0" stroke="#22c55e" stroke-width="1" opacity="0.4"/>
      <line x1="12" y1="0" x2="20" y2="0" stroke="#22c55e" stroke-width="1" opacity="0.4"/>
      <line x1="0" y1="-20" x2="0" y2="-12" stroke="#22c55e" stroke-width="1" opacity="0.4"/>
      <line x1="0" y1="12" x2="0" y2="20" stroke="#22c55e" stroke-width="1" opacity="0.4"/>
    </g>

    <!-- Edge fades -->
    <rect x="0" y="0" width="80" height="400" fill="url(#bn-fade-l)"/>
    <rect x="1200" y="0" width="80" height="400" fill="url(#bn-fade-r)"/>

    <!-- Logo icon (small) -->
    <g transform="translate(80, 100)">
      <!-- Mini chart in logo -->
      <rect width="64" height="64" rx="14" fill="#111827" stroke="#1f2937" stroke-width="1"/>
      <path d="M 14 48 L 22 42 L 32 38 L 38 40 L 46 30 L 52 22" stroke="url(#bn-grad)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      <circle cx="52" cy="22" r="3.5" fill="#22c55e"/>
      <circle cx="52" cy="22" r="1.5" fill="#ffffff"/>
    </g>

    <!-- Typography -->
    <g filter="url(#bn-shadow)">
      <!-- fonPick name -->
      <text x="160" y="148" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="52" font-weight="800" letter-spacing="-1.5">
        <tspan fill="#e5e7eb">fon</tspan><tspan fill="url(#bn-grad)">Pick</tspan>
      </text>
    </g>

    <!-- Tagline -->
    <text x="82" y="195" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="18" fill="#94a3b8" letter-spacing="0.5">
      Intelligent Thai Stock Market Analysis Platform
    </text>

    <!-- Separator line -->
    <line x1="82" y1="218" x2="280" y2="218" stroke="url(#bn-grad)" stroke-width="2" opacity="0.4"/>

    <!-- Feature pills -->
    <g font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="12" font-weight="500">
      <!-- Smart Money -->
      <rect x="82" y="238" width="110" height="28" rx="14" fill="#111827" stroke="#1f2937" stroke-width="1"/>
      <text x="100" y="257" fill="#22c55e">&#x25CF;</text>
      <text x="112" y="256" fill="#9ca3af">Smart Money</text>

      <!-- Sector Rotation -->
      <rect x="202" y="238" width="130" height="28" rx="14" fill="#111827" stroke="#1f2937" stroke-width="1"/>
      <text x="220" y="257" fill="#3b82f6">&#x25CF;</text>
      <text x="232" y="256" fill="#9ca3af">Sector Rotation</text>

      <!-- Market Breadth -->
      <rect x="342" y="238" width="130" height="28" rx="14" fill="#111827" stroke="#1f2937" stroke-width="1"/>
      <text x="360" y="257" fill="#6366f1">&#x25CF;</text>
      <text x="372" y="256" fill="#9ca3af">Market Breadth</text>

      <!-- AI Insights -->
      <rect x="82" y="276" width="110" height="28" rx="14" fill="#111827" stroke="#1f2937" stroke-width="1"/>
      <text x="100" y="295" fill="#f59e0b">&#x25CF;</text>
      <text x="112" y="294" fill="#9ca3af">AI Insights</text>

      <!-- Correlations -->
      <rect x="202" y="276" width="110" height="28" rx="14" fill="#111827" stroke="#1f2937" stroke-width="1"/>
      <text x="220" y="295" fill="#ec4899">&#x25CF;</text>
      <text x="232" y="294" fill="#9ca3af">Correlations</text>
    </g>

    <!-- Tech stack badges area -->
    <g font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="11" opacity="0.6">
      <text x="82" y="340" fill="#6b7280">Next.js 16  ·  React 19  ·  TypeScript  ·  Firebase RTDB</text>
      <text x="82" y="360" fill="#6b7280">SET Market Data  ·  Real-time Analytics  ·  PWA</text>
    </g>
  </g>
</svg>
